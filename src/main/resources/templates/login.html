<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>APOLO · Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/apolo.css}">
</head>
<body class="pagina-login">
<main class="tarjeta-login">
    <h1>APOLO</h1>
    <p class="nota">Gestión de PQRS · Piel de Azúcar</p>

    <div class="mensaje error" th:if="${param.error}">Correo o contraseña incorrectos, o la cuenta está bloqueada.</div>
    <div class="mensaje ok" th:if="${param.salio}">Cerraste sesión.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Correo</label>
        <input id="username" name="username" type="email" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button class="boton" type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
