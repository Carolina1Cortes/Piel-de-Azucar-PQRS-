spring.application.name=apolo
server.port=8080
# Detrás del proxy de Codespaces, las redirecciones (login, cierre de sesión) usan la dirección pública y no localhost
server.forward-headers-strategy=framework

# --- Base de datos embebida en archivo (se crea sola en ./data) ---
spring.datasource.url=jdbc:h2:file:./data/apolo
spring.datasource.username=sa
spring.datasource.password=
# Consola H2 (solo si la aplicación se inicia en local): http://localhost:8080/h2-console (JDBC URL de arriba, usuario sa, sin contraseña)
spring.h2.console.enabled=true

# --- El esquema lo manda schema.sql (versionado); Hibernate no toca las tablas ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Conexión con Gmail (IMAP/SMTP) ---
# Si quedan vacíos, la aplicación usa el canal simulado con datos de prueba y sigue funcionando.
apolo.gmail.usuario=
apolo.gmail.clave-aplicacion=

# --- Reglas de negocio ---
apolo.plazo.dias-habiles=15

# --- Adjuntos de las respuestas (CU-02-HU-02) ---
# Tamaño máximo de todos los adjuntos de un mensaje, por canal (clave = canal en minúsculas)
apolo.adjuntos.tamano-maximo.gmail=10MB
# Carpeta donde se guardan los archivos (data/ está en el .gitignore)
apolo.adjuntos.directorio=data
# Límite técnico de Spring para recibir archivos: debe ser mayor que el máximo de cualquier canal
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
