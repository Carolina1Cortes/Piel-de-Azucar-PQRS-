spring.application.name=apolo
server.port=8080

# --- Base de datos embebida en archivo (se crea sola en ./data) ---
spring.datasource.url=jdbc:h2:file:./data/apolo
spring.datasource.username=sa
spring.datasource.password=
# Consola H2 para la sustentación: http://localhost:8080/h2-console (JDBC URL de arriba, usuario sa, sin contraseña)
spring.h2.console.enabled=true

# --- El esquema lo manda schema.sql (versionado); Hibernate no toca las tablas ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Conexión con Gmail (IMAP/SMTP) ---
# Si quedan vacíos, la aplicación usa el canal simulado con datos de prueba y sigue funcionando.
apolo.gmail.usuario=
apolo.gmail.clave-aplicacion=

# --- Reglas de negocio ---
apolo.plazo.dias-habiles=15
