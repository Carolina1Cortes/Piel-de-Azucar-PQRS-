name: Verificación

# E5-15: ./mvnw verify (pruebas + 80 % de cobertura en servicios) en cada push y Pull Request.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar (pruebas y cobertura)
        run: ./mvnw -B verify
      - name: Informe de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco
